function jsonp(params,timeout=8000){return new Promise((resolve,reject)=>{const cb="jc_cb_"+Date.now()+"_"+Math.random().toString(36).slice(2),s=document.createElement("script"),timer=setTimeout(()=>done(new Error("timeout")),timeout);function done(err,data){clearTimeout(timer);delete window[cb];s.remove();err?reject(err):resolve(data)}window[cb]=d=>done(null,d);const u=new URL(window.ATTENDANCE_CONFIG?.webAppUrl||"");Object.entries({...params,callback:cb}).forEach(([k,v])=>u.searchParams.set(k,v));s.src=u.toString();s.onerror=()=>done(new Error("network"));document.body.appendChild(s)})}
async function sync(){if(!window.ATTENDANCE_CONFIG?.webAppUrl){$("#connectionText").textContent="Demo mode — connect Apps Script to enable live sync";return}$("#sync").classList.add("spinning");try{const d=await jsonp({action:"list",key:window.ATTENDANCE_CONFIG.sharedKey||""});if(!d.ok)throw new Error(d.error||"sync");applyServer(d.guests)}catch(e){$("#dot").classList.remove("live");$("#connectionText").textContent="Sync unavailable — tap ↻ to retry"}finally{$("#sync").classList.remove("spinning")}}
async function setAttendance(g,value){const old={attended:g.attended,time:g.time,by:g.by};g.attended=value;g.time=value?new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):"";g.by=value?(window.ATTENDANCE_CONFIG?.deviceName||"Check-in"):"";render();if(!window.ATTENDANCE_CONFIG?.webAppUrl){toast(value?g.name+" marked attended":"Attendance undone");return}try{const d=await jsonp({action:"set",id:g.id,attended:value?"true":"false",by:window.ATTENDANCE_CONFIG.deviceName||"Check-in",key:window.ATTENDANCE_CONFIG.sharedKey||""});if(!d.ok)throw new Error(d.error||"save");if(d.guest){g.attended=!!d.guest.attended;g.time=d.guest.time||g.time;g.by=d.guest.by||g.by}render();toast(value?g.name+" checked in":"Attendance undone")}catch(e){Object.assign(g,old);render();toast("Could not save — attendance was not changed")}}
function toggleGuest(g){if(!g.attended){setAttendance(g,true);return}state.undo=g;$("#modalText").textContent=`${g.name} is already marked attended${g.time?" at "+g.time:""}. Only undo this if it was checked by mistake.`;$("#modalBack").classList.add("show")}
$("#cancelUndo").addEventListener("click",()=>{$("#modalBack").classList.remove("show");state.undo=null});
$("#confirmUndo").addEventListener("click",()=>{const g=state.undo;$("#modalBack").classList.remove("show");state.undo=null;if(g)setAttendance(g,false)});
$("#modalBack").addEventListener("click",e=>{if(e.target===$("#modalBack")){$("#modalBack").classList.remove("show");state.undo=null}});
$("#search").addEventListener("input",e=>{state.query=e.target.value;renderGuests()});
$("#sync").addEventListener("click",sync);
render();sync();setInterval(()=>{if(document.visibilityState==="visible")sync()},5000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")sync()});
</script>
</body>
</html>
