<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff9f6">
<title>Jennifer & Charlie — Wedding Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--rose:#c97579;--rose2:#ad555b;--champ:#caa77b;--ink:#2f2a28;--muted:#8e8581;--line:#ecdcd6;--green:#4e8066;--greenbg:#edf6f0;--cream:#fffaf7;--shadow:0 10px 28px rgba(91,59,49,.10)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#fff9f6}button,input{font:inherit}
.app{width:min(900px,100%);margin:auto;padding:12px 10px 35px}.hero{text-align:center;padding:13px 6px 16px}.mono{font-family:"Cormorant Garamond",serif;color:var(--champ);font-size:32px;letter-spacing:.14em}.title{font-family:"Cormorant Garamond",serif;font-size:clamp(31px,8vw,52px);font-weight:500;letter-spacing:.045em;margin:2px 0 0}.sub{font-size:11px;letter-spacing:.19em;color:var(--rose);text-transform:uppercase;margin-top:7px}
.card{background:#fffdfb;border:1px solid rgba(213,174,159,.28);border-radius:20px;box-shadow:var(--shadow)}.summary{padding:15px;margin-bottom:12px}.summary-top{display:flex;justify-content:space-between;align-items:end;gap:12px}.summary-num{font-family:"Cormorant Garamond",serif;font-size:36px;line-height:1;color:var(--green);font-weight:600}.summary-label{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin-top:3px}.remaining{text-align:right;font-size:12px;color:var(--muted)}.progress{height:8px;border-radius:99px;background:#f0e6e1;overflow:hidden;margin-top:12px}.bar{height:100%;width:0;background:var(--green);transition:width .25s}
.tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}.search-wrap{position:relative;min-width:0}.search{width:100%;height:50px;border:1px solid var(--line);border-radius:15px;background:#fff;padding:0 15px;font-size:16px;outline:none;min-width:0}.search:focus{border-color:#d89a99;box-shadow:0 0 0 3px rgba(201,117,121,.09)}.search-wrap .search{padding-right:52px}.clear-search{display:none;position:absolute;right:5px;top:5px;width:40px;height:40px;border:0;border-radius:12px;background:#f7ece8;color:var(--rose2);font-size:28px;line-height:1;align-items:center;justify-content:center;cursor:pointer}.clear-search.show{display:flex}.clear-search:focus{outline:2px solid var(--rose);outline-offset:1px}.sync{min-width:50px;border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--rose);font-size:20px}.sync.spinning{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.tables{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:13px}.table-btn{min-height:61px;border:1px solid var(--line);background:#fffdfb;border-radius:14px;padding:7px 4px;color:var(--ink)}.table-btn.active{border-color:var(--rose);box-shadow:0 0 0 2px rgba(201,117,121,.10);background:#fff7f5}.table-btn.complete{background:var(--greenbg);border-color:#cfe2d5}.tn{font-weight:700;font-size:13px}.tc{font-size:10px;color:var(--muted);margin-top:4px}.table-btn.complete .tc{color:var(--green);font-weight:700}
.panel{overflow:hidden}.panel-head{padding:14px 15px 11px;border-bottom:1px solid #f0e4df;display:flex;justify-content:space-between;align-items:center;gap:10px}.panel-title{font-family:"Cormorant Garamond",serif;font-size:27px;font-weight:600}.panel-count{font-size:11px;color:var(--muted);text-align:right}.guest-list{padding:7px}.guest{width:100%;min-height:58px;border:0;border-bottom:1px solid #f2e8e4;background:transparent;display:flex;align-items:center;gap:11px;text-align:left;padding:9px 8px;border-radius:12px;color:var(--ink)}.guest:last-child{border-bottom:0}.guest.attended{background:var(--greenbg);border-bottom-color:transparent}.check{width:32px;height:32px;flex:0 0 32px;border:2px solid #d9c8c1;border-radius:50%;display:grid;place-items:center;color:white;font-weight:800}.attended .check{background:var(--green);border-color:var(--green)}.gcopy{min-width:0;flex:1}.gname{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gmeta{display:block;font-size:10px;color:var(--muted);margin-top:4px}.attended .gmeta{color:var(--green);font-weight:600}.status{font-size:10px;font-weight:700;color:var(--green);text-transform:uppercase}.guest-actions{display:flex;align-items:center;gap:7px;flex:0 0 auto}.gift-btn{min-height:38px;min-width:58px;border:1px solid #ddc6bb;border-radius:11px;background:#fff8f4;color:#9b6754;font-size:11px;font-weight:700;padding:6px 9px}.gift-btn.has-gift{background:#f3e6d6;border-color:#d5b38b;color:#76523f}.gift-mark{font-size:12px;font-weight:700;color:#9b6754}.empty{text-align:center;padding:28px 15px;color:var(--muted);font-size:13px}
.connection{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:10px;margin:10px 0}.dot{width:7px;height:7px;border-radius:50%;background:#d7b38b}.dot.live{background:var(--green)}.footer{text-align:center;font-size:9px;color:#aaa09c;margin-top:17px}
.modal-back{position:fixed;inset:0;background:rgba(48,37,33,.36);display:none;align-items:end;justify-content:center;padding:12px;z-index:30}.modal-back.show{display:flex}.modal{width:min(500px,100%);background:#fff;border-radius:22px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.18)}.modal h3{font-family:"Cormorant Garamond",serif;font-size:27px;margin:0 0 7px}.modal p{font-size:13px;color:var(--muted);line-height:1.5}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.modal button{min-height:47px;border-radius:14px;border:1px solid var(--line);background:#fff;font-weight:700}.modal .danger{background:#b85d62;color:#fff;border-color:#b85d62}
.guest.saving{opacity:.72;pointer-events:none}.gift-btn:disabled,.group-btn:disabled{opacity:.55}.connection.warn{color:#9b6754}.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#3e3937;color:#fff;padding:11px 14px;border-radius:12px;font-size:11px;z-index:40;transition:.2s;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}


.group-card{margin:10px 0 13px;border:1px solid #ead7cf;border-radius:16px;background:#fffaf7;overflow:hidden}
.group-head{padding:12px 13px 9px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.group-kicker{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--rose2);font-weight:700}
.group-name{font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:600;line-height:1.05;margin-top:2px}
.group-count{font-size:10px;color:var(--muted);white-space:nowrap}
.group-members{padding:0 13px 10px}
.group-member{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid #f0e4df;font-size:11px}
.group-member:first-child{border-top:0}.group-member.done{color:var(--green);font-weight:700}
.group-actions-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 13px 13px}
.group-btn{min-height:43px;border:1px solid #ddc6bb;border-radius:12px;background:white;color:var(--ink);font-size:11px;font-weight:700;padding:7px}
.group-btn.primary{background:var(--rose2);border-color:var(--rose2);color:white}
.group-btn.gifted{background:#f3e6d6;border-color:#d5b38b;color:#76523f}
.table-peers{margin:0 0 12px;padding:10px 12px;border:1px dashed #e3d0c7;border-radius:13px;background:#fff;font-size:10px;color:var(--muted)}
.table-peers strong{color:var(--ink)}

.table-map{padding:13px 13px 15px;border-top:1px solid #f0e4df;background:#fffaf7}
.table-map-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}
.table-map-title{font-family:"Cormorant Garamond",serif;font-size:21px;font-weight:600}
.table-map-note{font-size:9px;color:var(--muted);text-align:right}
.map-window{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:15px;border:1px solid #ead8ca;background:#f0e5d9}
.map-stage{position:absolute;width:1254px;height:1254px;transform-origin:0 0;will-change:transform}
.map-stage img{position:absolute;inset:0;width:1254px;height:1254px;display:block;user-select:none;-webkit-user-drag:none}
.map-pin{position:absolute;width:78px;height:78px;border-radius:50%;border:6px solid rgba(173,85,91,.98);background:rgba(255,255,255,.08);box-shadow:0 0 0 8px rgba(201,117,121,.22);transform:translate(-50%,-50%);display:grid;place-items:center;color:transparent;font-size:0;font-weight:800;pointer-events:none;animation:mapPulse 1.25s ease-out infinite}
.map-pin::before{content:"";position:absolute;inset:-18px;border:4px dashed rgba(173,85,91,.9);border-radius:inherit;animation:mapSpin 5s linear infinite}
.map-pin::after{content:none}
@keyframes mapPulse{0%{box-shadow:0 0 0 5px rgba(201,117,121,.38),0 0 0 5px rgba(201,117,121,.25)}70%{box-shadow:0 0 0 10px rgba(201,117,121,.16),0 0 0 30px rgba(201,117,121,0)}100%{box-shadow:0 0 0 8px rgba(201,117,121,.20),0 0 0 34px rgba(201,117,121,0)}}
@keyframes mapSpin{to{transform:rotate(360deg)}}
.map-pin.main{width:480px;height:118px;border-radius:24px;font-size:0;background:rgba(255,255,255,.08);color:transparent}
.map-hint{text-align:center;color:var(--muted);font-size:9px;margin-top:7px}

@media(min-width:650px){.tables{grid-template-columns:repeat(8,1fr)}.guest-list{display:grid;grid-template-columns:1fr 1fr;gap:5px}.guest{border:1px solid #f1e6e1}.modal-back{align-items:center}}
</style>

<style>
#dot.syncing{background:#c6927b;box-shadow:0 0 0 0 rgba(198,146,123,.55);animation:attPulse 1s ease-in-out infinite}
#dot.delayed{background:#c9a24f}
#sync.spinning{animation:attSpin .85s linear infinite}
@keyframes attSpin{to{transform:rotate(360deg)}}
@keyframes attPulse{0%{box-shadow:0 0 0 0 rgba(198,146,123,.55)}70%{box-shadow:0 0 0 8px rgba(198,146,123,0)}100%{box-shadow:0 0 0 0 rgba(198,146,123,0)}}
</style>
</head>
<body>
<div class="app">
<header class="hero"><div class="mono">J&nbsp; | &nbsp;C</div><h1 class="title">Wedding Attendance</h1><div class="sub">26 September 2026</div></header>

<section class="summary card">
 <div class="summary-top"><div><div class="summary-num"><span id="arrived">0</span> / <span id="total">0</span></div><div class="summary-label">Guests arrived</div></div><div class="remaining"><b id="remaining">0</b> remaining<br><span id="percent">0%</span> checked in</div></div>
 <div class="progress"><div class="bar" id="bar"></div></div>
</section>

<div class="tools"><div class="search-wrap"><input id="search" class="search" placeholder="Search guest name…" autocomplete="off"><button id="clearSearch" class="clear-search" type="button" aria-label="Clear guest search">×</button></div><button id="sync" class="sync" type="button" aria-label="Refresh attendance">↻</button></div>
<div id="tables" class="tables"></div>

<section class="panel card">
 <div class="panel-head"><div id="panelTitle" class="panel-title">All Guests</div><div id="panelCount" class="panel-count"></div></div>
 <div id="guestList" class="guest-list"></div>
 <div id="tableMap" class="table-map" hidden>
   <div class="table-map-head"><div id="tableMapTitle" class="table-map-title">Table location</div><div class="table-map-note">Reception layout</div></div>
   <div id="mapWindow" class="map-window">
     <div id="mapStage" class="map-stage">
       <img src="wedding-map.png?v=81" alt="Reception table layout">
       <div id="mapPin" class="map-pin"></div>
     </div>
   </div>
   <div class="map-hint">Highlighted on the same reception map as the Seat Finder</div>
 </div>
</section>
<div class="connection"><span id="dot" class="dot"></span><span id="connectionText">Local guest list ready</span></div>
<div class="footer">Jennifer & Charlie · Private wedding check-in</div>
</div>

<div id="modalBack" class="modal-back">
 <div class="modal"><h3>Undo attendance?</h3><p id="modalText"></p><div class="modal-actions"><button id="cancelUndo" type="button">Keep attended</button><button id="confirmUndo" class="danger" type="button">Undo</button></div></div>
</div>
<div id="toast" class="toast"></div>
<script src="config.js?v=18"></script>
<script src="app.js?v=18"></script>
</body>
</html>
